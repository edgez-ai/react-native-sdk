name: Build Windows example release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: react-native-example-windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x64 release artifact
    runs-on: windows-2025-vs2026
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm
          cache-dependency-path: desktop-example/windows-app/package-lock.json

      - name: Install Windows example dependencies
        working-directory: desktop-example/windows-app
        run: npm ci

      - name: Generate React Native Windows project
        working-directory: desktop-example/windows-app
        run: npm run windows:init

      - name: Type-check Windows example
        working-directory: desktop-example/windows-app
        run: npm run typecheck

      - name: Build Windows x64 release
        working-directory: desktop-example/windows-app
        run: npm run build:windows

      - name: Collect portable Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $windowsRoot = Join-Path $env:GITHUB_WORKSPACE 'desktop-example/windows-app/windows'
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'release-artifacts'
          $portableRoot = Join-Path $artifactRoot 'edgez-react-native-example-windows-x64'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null

          $executable = Get-ChildItem -Path $windowsRoot -File -Filter 'EdgezWindowsExample.exe' -Recurse |
            Where-Object {
              $_.FullName -match '[\\/]x64[\\/]Release[\\/]' -and
              $_.FullName -notmatch '[\\/](AppPackages|obj)[\\/]'
            } |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1

          if (-not $executable) {
            Write-Host 'Release executables found:'
            Get-ChildItem -Path $windowsRoot -File -Filter '*.exe' -Recurse |
              ForEach-Object { Write-Host $_.FullName }
            throw 'Could not find the generated EdgezWindowsExample x64 Release executable.'
          }

          Copy-Item -Path (Join-Path $executable.Directory.FullName '*') -Destination $portableRoot -Recurse -Force

          $bundle = Get-ChildItem -Path $windowsRoot -File -Filter 'index.windows.bundle' -Recurse |
            Where-Object { $_.Directory.Name -eq 'Bundle' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $bundle) {
            throw 'The Release build did not produce Bundle/index.windows.bundle.'
          }
          $bundleDestination = Join-Path $portableRoot 'Bundle'
          New-Item -ItemType Directory -Path $bundleDestination -Force | Out-Null
          Copy-Item -Path (Join-Path $bundle.Directory.FullName '*') -Destination $bundleDestination -Recurse -Force

          @'
          RUNNING THE EDGEZ WINDOWS EXAMPLE

          This is a portable, self-contained x64 build. It does not use an installer
          or MSIX publisher certificate.

          1. Extract this entire ZIP file.
          2. Keep the DLL and Bundle files beside EdgezWindowsExample.exe.
          3. Double-click EdgezWindowsExample.exe.

          Windows SmartScreen may warn because this development executable is not
          signed by a public code-signing authority. Only run archives downloaded
          from the official edgez-ai/react-native-sdk GitHub release.
          '@ | Set-Content -LiteralPath (Join-Path $portableRoot 'README.txt') -Encoding utf8

          if (-not (Test-Path -LiteralPath (Join-Path $portableRoot 'EdgezWindowsExample.exe'))) {
            throw 'The portable release staging directory is missing EdgezWindowsExample.exe.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $portableRoot 'Bundle/index.windows.bundle'))) {
            throw 'The portable release staging directory is missing the JavaScript bundle.'
          }

          $archive = Join-Path $artifactRoot 'edgez-react-native-example-windows-x64-portable.zip'
          Compress-Archive -Path (Join-Path $portableRoot '*') -DestinationPath $archive -Force
          Write-Host "Packaged $($executable.Directory.FullName) as $archive"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-native-example-windows-release-${{ github.run_number }}
          path: release-artifacts/edgez-react-native-example-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows package to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/edgez-react-native-example-windows-x64-portable.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
