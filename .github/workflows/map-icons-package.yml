name: Package React Native SDK

on:
  push:
    branches: [codex/map-point-icons]
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: mkdir -p dist
      - id: package
        run: |
          npm pack --pack-destination dist
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: edgez-react-native-sdk-${{ steps.package.outputs.version }}
          path: dist/*.tgz
          if-no-files-found: error
      - name: Attach SDK package to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Publish SDK to npm with provenance
        if: github.ref == 'refs/heads/codex/map-point-icons' && startsWith(github.event.head_commit.message, 'release: publish')
        run: |
          npm install --global npm@latest
          npm publish --access public --provenance
