name: Package map icons SDK

on:
  push:
    branches: [codex/map-point-icons]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: mkdir -p dist
      - run: npm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: edgez-react-native-sdk-0.1.3
          path: dist/*.tgz
          if-no-files-found: error
